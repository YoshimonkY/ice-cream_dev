<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Order App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .flavor-section {
            margin-bottom: 30px;
        }

        .flavor-section h2 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .flavors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .flavor-item {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .flavor-item:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .flavor-item.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .flavor-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .flavor-price {
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .quantity-btn {
            background: #667eea;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .quantity-btn:hover {
            background: #5a67d8;
        }

        .quantity-display {
            font-size: 1.2em;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .order-summary {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
        }

        .order-summary h3 {
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 10px;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 10px;
            min-width: 150px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn-container .btn {
            flex: 1;
            max-width: 200px;
        }

        .ticket {
            background: white;
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            font-family: monospace;
            white-space: pre-line;
        }

        @media (max-width: 768px) {
            .flavors-grid {
                grid-template-columns: 1fr;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🍨 Ice Cream Orders</h1>

        <div class="flavor-section">
            <h2>Basic Flavors - $2.00 per scoop</h2>
            <div class="flavors-grid">
                <div class="flavor-item" data-flavor="Vanilla" data-price="2.00" data-type="basic">
                    <div class="flavor-name">Vanilla</div>
                    <div class="flavor-price">$2.00 per scoop</div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="changeQuantity(this, -1)">-</button>
                        <span class="quantity-display">0</span>
                        <button class="quantity-btn" onclick="changeQuantity(this, 1)">+</button>
                    </div>
                </div>
                <div class="flavor-item" data-flavor="Chocolate" data-price="2.00" data-type="basic">
                    <div class="flavor-name">Chocolate</div>
                    <div class="flavor-price">$2.00 per scoop</div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="changeQuantity(this, -1)">-</button>
                        <span class="quantity-display">0</span>
                        <button class="quantity-btn" onclick="changeQuantity(this, 1)">+</button>
                    </div>
                </div>
                <div class="flavor-item" data-flavor="Strawberry" data-price="2.00" data-type="basic">
                    <div class="flavor-name">Strawberry</div>
                    <div class="flavor-price">$2.00 per scoop</div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="changeQuantity(this, -1)">-</button>
                        <span class="quantity-display">0</span>
                        <button class="quantity-btn" onclick="changeQuantity(this, 1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="flavor-section">
            <h2>Premium Flavors - $3.00 per scoop</h2>
            <div class="flavors-grid">
                <div class="flavor-item" data-flavor="Mint" data-price="3.00" data-type="premium">
                    <div class="flavor-name">Mint</div>
                    <div class="flavor-price">$3.00 per scoop</div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="changeQuantity(this, -1)">-</button>
                        <span class="quantity-display">0</span>
                        <button class="quantity-btn" onclick="changeQuantity(this, 1)">+</button>
                    </div>
                </div>
                <div class="flavor-item" data-flavor="Pistachio" data-price="3.00" data-type="premium">
                    <div class="flavor-name">Pistachio</div>
                    <div class="flavor-price">$3.00 per scoop</div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" onclick="changeQuantity(this, -1)">-</button>
                        <span class="quantity-display">0</span>
                        <button class="quantity-btn" onclick="changeQuantity(this, 1)">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="order-summary">
            <h3>Your Order</h3>
            <div id="order-items"></div>
            <div class="order-total">
                <span>Total: $<span id="order-total">0.00</span></span>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="submitOrder()">Submit Order</button>
        </div>

        <div class="btn-container" id="new-order-container" style="display: none;">
            <button class="btn" onclick="startNewOrder()">New Order</button>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="window.location.href='orders.html'">View Order History</button>
            <button class="btn" onclick="window.location.href='all-orders.html'">All Orders List</button>
        </div>

        <div class="ticket" id="ticket" style="display: none;"></div>
    </div>

    <script>
        let orderItems = {};

        function changeQuantity(button, change) {
            const flavorItem = button.closest('.flavor-item');
            const quantityDisplay = flavorItem.querySelector('.quantity-display');
            const flavor = flavorItem.dataset.flavor;
            const price = parseFloat(flavorItem.dataset.price);

            let currentQuantity = parseInt(quantityDisplay.textContent);
            currentQuantity = Math.max(0, currentQuantity + change);

            quantityDisplay.textContent = currentQuantity;

            if (currentQuantity > 0) {
                orderItems[flavor] = { flavor, quantity: currentQuantity, price };
                flavorItem.classList.add('selected');
            } else {
                delete orderItems[flavor];
                flavorItem.classList.remove('selected');
            }

            updateOrderSummary();
        }

        function updateOrderSummary() {
            const orderItemsContainer = document.getElementById('order-items');
            const orderTotalElement = document.getElementById('order-total');

            orderItemsContainer.innerHTML = '';

            let total = 0;
            Object.values(orderItems).forEach(item => {
                const itemTotal = item.quantity * item.price;
                total += itemTotal;

                const orderItem = document.createElement('div');
                orderItem.className = 'order-item';
                orderItem.innerHTML = `
                    <span>${item.flavor} (${item.quantity} scoops)</span>
                    <span>$${itemTotal.toFixed(2)}</span>
                `;
                orderItemsContainer.appendChild(orderItem);
            });

            orderTotalElement.textContent = total.toFixed(2);
        }


        async function submitOrder() {
            const total = parseFloat(document.getElementById('order-total').textContent);
            if (total === 0) {
                alert('Please select at least one item to submit the order.');
                return;
            }

            // Generate ticket automatically before submitting
            const ticketContainer = document.getElementById('ticket');
            const timestamp = new Date().toLocaleString();

            let ticket = `🍨 ICE CREAM ORDER TICKET 🍨
================================
${timestamp}
--------------------------------
`;

            Object.values(orderItems).forEach(item => {
                ticket += `${item.flavor} (${item.quantity} scoops) - $${(item.quantity * item.price).toFixed(2)}\n`;
            });

            ticket += `--------------------------------
TOTAL: $${total.toFixed(2)}

Thank you for your order!
================================`;

            ticketContainer.textContent = ticket;
            ticketContainer.style.display = 'block';

            const items = Object.values(orderItems);

            try {
                const response = await fetch('/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ items, total, ticket }),
                });

                if (response.ok) {
                    alert('Order submitted successfully!');
                    // Show the New Order button and hide Submit Order button
                    document.getElementById('new-order-container').style.display = 'block';
                    document.querySelector('.btn-container').style.display = 'none';
                } else {
                    alert('Error submitting order. Please try again.');
                }
            } catch (error) {
                alert('Error submitting order. Please check if the server is running.');
            }
        }

        function startNewOrder() {
            // Reset the form
            document.querySelectorAll('.quantity-display').forEach(display => {
                display.textContent = '0';
            });
            document.querySelectorAll('.flavor-item').forEach(item => {
                item.classList.remove('selected');
            });
            orderItems = {};
            updateOrderSummary();

            // Hide the ticket and New Order button, show Submit Order button
            document.getElementById('ticket').style.display = 'none';
            document.getElementById('new-order-container').style.display = 'none';
            document.querySelector('.btn-container').style.display = 'flex';
        }
    </script>
</body>

</html>
