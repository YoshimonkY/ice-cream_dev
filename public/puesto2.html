<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puesto 2 - Heladería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: rgb(22, 165, 9);
            padding: 0px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 100px;
            margin-bottom: 10px;
        }

        .header-container h3 {
            margin: 0;
            padding: 5px 10px;
            /* background: linear-gradient(135deg, #ff6b6b, #ee5a52); */
            color: white;
            border-radius: 5px;
        }

        .container {
            max-width: 100%;
            /*FAQ*/
            width: 100%;
            text-align: center;
            /* background: rgb(22, 165, 9);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1); */
            padding: 0px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 7.5px;
            font-size: 2.5em;
        }

        .flavor-section {
            margin-bottom: 7.5px;
        }

        .flavor-section h2 {
            /* background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white; */
            padding: 3.75px;
            border-radius: 3.75px;
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .flavors-buttons-container {
            /* min-width: 350px; */
            /*FAQ*/
            /* background: transparent;*/
            justify-content: center;
            /* Add this line to center horizontally */
            display: flex;
            gap: 5px;
            margin-bottom: 5px;

        }

        .flavors-column {
            max-width: 400px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            /* background-color: rgb(22, 165, 9); */

            /* Add this line */
        }

        .flavor-btn {
            background: #66e634;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px 5px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .flavor-btn:hover {
            border-color: #ff6b6b;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Enhanced active state with higher specificity */
        .flavor-btn.active,
        .flavors-column .flavor-btn.active {
            border-color: #ff6b6b !important;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%) !important;
            color: white !important;
        }

        .flavor-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .flavor-name {
            font-size: 0.9em;
            margin-bottom: 2px;
        }

        .flavor-price {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .quantity-controls-section {
            background: #f8f9fa;
            padding: 5px 7.5px;
            border-radius: 5px;
            margin-bottom: 5px;
            text-align: center;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        /* Removed undo button styles */

        .quantity-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .quantity-btn:hover {
            background: linear-gradient(135deg, #e55353, #dc3545);
            transform: translateY(-1px);
        }

        .quantity-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .order-preview {
            background: white;
            padding: 5px;
            margin-top: 7.5px;
            border: 1px solid #ddd;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
            font-size: 14px;
        }

        .order-table td {
            padding: 4px 8px;
            vertical-align: top;
            border: none;
            text-align: left;
        }

        .cup-delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .cup-delete-btn:hover {
            background: #c82333;
        }

        /* Cup indicator styles removed */

        .btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            border: none;
            padding: 3.75px 7.5px;
            border-radius: 6.25px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 2.5px;
            min-width: 150px;
        }

        .btn:hover {
            transform: translateY(-0.5px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 5px;
        }

        .btn-container .btn {
            flex: 1;
            max-width: 200px;
        }

        .ticket {
            background: white;
            border: 0.5px dashed #ff6b6b;
            border-radius: 3.75px;
            padding: 5px;
            margin-top: 5px;
            font-family: monospace;
            white-space: pre-line;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: #636e72;
            font-size: 1.1em;
        }

        .cup-number {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cup-number:hover {
            color: #ff6b6b;
        }

        .cup-number.delete-mode {
            background: #ff6b6b;
            color: white;
            border-radius: 3px;
            padding: 2px 5px;
        }

        @media (max-width: 768px) {
            .flavors-buttons-container {
                flex-direction: row;
                gap: 2px;
                min-width: unset;
                width: 100%;
                /*FAQ*/
            }

            .flavors-column {
                min-width: calc(50% - 1px);
                background: transparent;
                /* FAQ */
                border: none;
                /* Set minimum width to half container minus gap */
                gap: 2px;
            }

            .flavor-btn {
                min-height: 40px;
                font-size: 1.2em;
            }

            .flavor-name {
                font-size: 0.8em;
            }

            .flavor-price {
                font-size: 0.7em;
            }

            .quantity-controls {
                gap: 3px;
            }

            .quantity-btn {
                width: 50px;
                height: 50px;
                font-size: 1em;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }

            .btn-container .btn {
                width: 100%;
                max-width: 250px;
            }

            h1 {
                font-size: 2em;
            }

            .order-table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header-container">
            <h3>Puesto 2</h3>
            <h3>Usuario</h3>
        </div>

        <div id="flavors-container">
            <div class="loading" id="loading">Loading flavors...</div>
        </div>

        <div class="quantity-controls-section">
            <div class="quantity-controls">
                <button class="btn" style="min-width: 10px;" onclick="createNewCup()">+🥤</button>
                <button class="quantity-btn" onclick="addScoops(1)">+1</button>
                <button class="quantity-btn" onclick="addScoops(3)">+3</button>
                <button class="quantity-btn" onclick="addScoops(6)">+6</button>


            </div>
        </div>

        <div class="order-preview">
            <div id="order-preview-content">
                <table class="order-table" id="order-table">
                    <tr>
                        <td style="width: 80px;"></td>
                        <td style="width: 200px;">No items in order</td>
                        <td style="width: 80px;"></td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn" style="min-width: 10px;" onclick="submitOrder()">✔️</button>
        </div>

        <div class="btn-container" id="new-order-container" style="display: none;">
            <button class="btn" onclick="startNewOrder()">New Order</button>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="window.location.href='orders.html'">View Order History</button>
            <button class="btn" onclick="window.location.href='inventory.html'"
                style="background: linear-gradient(135deg, #667eea, #764ba2);">📦 Manage Inventory</button>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="window.location.href='tienda.html'"
                style="background: linear-gradient(135deg, #28a745, #20c997);">🏪 Advanced Store</button>
        </div>

        <div class="ticket" id="ticket" style="display: none;"></div>
    </div>

    <script>
        let currentCupNumber = 1;
        let cups = [];
        let currentCup = {
            cupNumber: 1,
            items: {},
            totalScoops: 0,
            subtotal: 0
        };
        let availableFlavors = [];
        let selectedFlavor = null;
        let deleteModeCups = new Set(); // Track which cups are in delete mode

        // Load flavors from puesto2 store
        async function loadFlavors() {
            try {
                const response = await fetch('/store-flavors/puesto2');
                const flavors = await response.json();

                if (!response.ok) {
                    throw new Error(flavors.error || 'Error loading flavors');
                }

                // Filter only active flavors for this store
                availableFlavors = flavors.filter(flavor => flavor.store_active);
                displayFlavors(availableFlavors);

                if (availableFlavors.length === 0) {
                    document.getElementById('loading').innerHTML = 'No active flavors available for this store. Please check inventory.';
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading flavors: ' + error.message;
                console.error('Error loading flavors:', error);
            }
        }

        // Display flavors in two-column button layout
        function displayFlavors(flavors) {
            const container = document.getElementById('flavors-container');

            if (flavors.length === 0) {
                container.innerHTML = '<div class="loading">No flavors available</div>';
                return;
            }

            // Split flavors into two columns
            const midPoint = Math.ceil(flavors.length / 2);
            const leftColumn = flavors.slice(0, midPoint);
            const rightColumn = flavors.slice(midPoint);

            let html = '<div class="flavors-buttons-container">';

            // Left column
            html += '<div class="flavors-column">';
            leftColumn.forEach(flavor => {
                const isActive = selectedFlavor === flavor.name;
                const activeClass = isActive ? 'active' : '';
                const buttonStyle = isActive ? 'background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); color: white;' : '';

                html += `
                    <button class="flavor-btn ${activeClass}"
                            onclick="selectFlavor('${flavor.name}')"
                            data-flavor="${flavor.name}"
                            style="${buttonStyle}">
                        <div class="flavor-name">${flavor.name}</div>
                    </button>
                `;
            });
            html += '</div>';

            // Right column
            html += '<div class="flavors-column">';
            rightColumn.forEach(flavor => {
                const isActive = selectedFlavor === flavor.name;
                const activeClass = isActive ? 'active' : '';
                const buttonStyle = isActive ? 'background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%); color: white;' : '';

                html += `
                    <button class="flavor-btn ${activeClass}"
                            onclick="selectFlavor('${flavor.name}')"
                            data-flavor="${flavor.name}"
                            style="${buttonStyle}">
                        <div class="flavor-name">${flavor.name}</div>
                    </button>
                `;
            });
            html += '</div>';

            html += '</div>';
            container.innerHTML = html;
            updateOrderPreview();
        }

        // Select flavor (only one can be active)
        function selectFlavor(flavorName) {
            selectedFlavor = flavorName;
            updateOrderPreview();
            displayFlavors(availableFlavors);
        }

        // Add scoops to selected flavor
        function addScoops(amount) {
            if (!selectedFlavor) {
                alert('Habilita un sabor primero!');
                return;
            }

            const flavor = availableFlavors.find(f => f.name === selectedFlavor);
            if (!flavor) return;

            const currentQuantity = currentCup.items[selectedFlavor]?.quantity || 0;
            const newQuantity = currentQuantity + amount;

            // Check if this would exceed 6 scoops per cup
            const totalScoopsAfter = currentCup.totalScoops - currentQuantity + newQuantity;
            if (totalScoopsAfter > 6) {
                alert(`Maximo 6 bolas por vaso. Ahora hay ${currentCup.totalScoops} bolas en el vaso.`);
                return;
            }

            // No undo tracking

            // Update current cup
            if (newQuantity > 0) {
                currentCup.items[selectedFlavor] = { flavor: selectedFlavor, quantity: newQuantity, price: flavor.price };
            } else {
                delete currentCup.items[selectedFlavor];
            }

            currentCup.totalScoops = totalScoopsAfter;
            currentCup.subtotal = calculateCupSubtotal();

            // Auto-create new cup if current cup reaches 6 scoops
            if (currentCup.totalScoops >= 6) {
                createNewCup();
            }

            updateOrderPreview();
            displayFlavors(availableFlavors);
        }

        // Undo functionality removed

        // Create new cup
        function createNewCup() {
            if (currentCup.totalScoops > 0) {
                // Save current cup to cups array
                cups.push({ ...currentCup });
                currentCupNumber++;
            }

            // Initialize new cup
            currentCup = {
                cupNumber: currentCupNumber,
                items: {},
                totalScoops: 0,
                subtotal: 0
            };

            /* selectedFlavor = null; */ /* Sin esta linea no se desactiva el sabor seleccionado */
            deleteModeCups.clear();
            updateOrderPreview();
            displayFlavors(availableFlavors);
        }

        // Calculate cup subtotal
        function calculateCupSubtotal() {
            return Object.values(currentCup.items).reduce((sum, item) => {
                return sum + (item.quantity * item.price);
            }, 0);
        }

        // Calculate total scoops in current cup
        function calculateCupTotalScoops() {
            return Object.values(currentCup.items).reduce((sum, item) => {
                return sum + item.quantity;
            }, 0);
        }

        // Cup indicator function removed

        // Update order preview with plain text table
        function updateOrderPreview() {
            const orderTable = document.getElementById('order-table');

            // Combine all cups (including current) for preview
            const allCups = [...cups];
            if (currentCup.totalScoops > 0) {
                allCups.push({ ...currentCup });
            }

            if (allCups.length === 0) {
                orderTable.innerHTML = `<tr>
                    <td style="width: 160px;">Vaso vacío</td>
                    <td style="width: 150px;"></td>
                    <td style="width: 150px;"></td>
                </tr>`;
                return;
            }

            let tableHtml = '';

            allCups.forEach((cup) => {
                const cupItems = Object.values(cup.items);
                if (cupItems.length === 0) return;

                // For each cup, create one row for each flavor
                cupItems.forEach((item, itemIndex) => {
                    const isFirstItemInCup = itemIndex === 0;
                    tableHtml += `<tr>`;

                    // Modified cup number cell to be interactive
                    if (isFirstItemInCup) {
                        tableHtml += `
                            <td style="width: 80px;">
                                <span class="cup-number"
                                    onclick="handleCupClick(this, ${cup.cupNumber})"
                                    data-cup="${cup.cupNumber}">
                                    Vaso ${cup.cupNumber}
                                </span>
                            </td>`;
                    } else {
                        tableHtml += `<td style="width: 80px;"></td>`;
                    }

                    // Second column: Flavor name and quantity
                    tableHtml += `<td style="width: 200px;">${item.flavor} (${item.quantity})</td>`;

                    // Third column: Price for this flavor
                    const flavorTotal = item.price * item.quantity;
                    tableHtml += `<td style="width: 80px; text-align: right;">$${flavorTotal.toFixed(2)}</td>`;

                    tableHtml += `</tr>`;
                });

                // Add a cup total row
                tableHtml += `
                <tr><td colspan="3">&nbsp;</td></tr>`;
            });

            // Add an order total row
            const orderTotal = allCups.reduce((sum, cup) => sum + cup.subtotal, 0);
            tableHtml += `<tr>
                <td style="width: 80px;"></td>
                <td style="width: 200px;"><b>TOTAL</b></td>
                <td style="width: 80px; text-align: right;"><b>$${orderTotal.toFixed(2)}</b></td>
            </tr>`;

            orderTable.innerHTML = tableHtml;
        }

        // Submit order with customer name prompt
        async function submitOrder() {
            // Check if there's anything to order
            const allCups = [...cups];
            if (currentCup.totalScoops > 0) {
                allCups.push({ ...currentCup });
            }

            if (allCups.length === 0) {
                alert('Agrega al menos una bolita para generar un pedido.');
                return;
            }

            // Prompt for customer name
            const customerName = prompt('Ingrese el nombre del cliente:');
            if (!customerName || customerName.trim() === '') {
                alert('Customer name is required.');
                return;
            }

            // Calculate total
            const total = allCups.reduce((sum, cup) => sum + cup.subtotal, 0);

            // Generate enhanced ticket
            const ticketContainer = document.getElementById('ticket');
            const timestamp = new Date().toLocaleString();

            let ticket = `🥤 PUESTO 2 - PEDIDO AVANZADO 🥤
============================================================
${timestamp}
Cliente: ${customerName}
============================================================`;

            allCups.forEach((cup, index) => {
                ticket += `\n🍨 VASO #${cup.cupNumber} (Total: $${cup.subtotal.toFixed(2)})`;
                ticket += `\n------------------------------------------------------------`;

                Object.values(cup.items).forEach(item => {
                    ticket += `\n${item.flavor} (${item.quantity} scoops) - $${(item.quantity * item.price).toFixed(2)}`;
                });

                if (Object.keys(cup.items).length === 0) {
                    ticket += `\nVacío`;
                }
            });

            ticket += `\n============================================================`;
            ticket += `\nTOTAL GENERAL: $${total.toFixed(2)}`;
            ticket += `\n\n¡Gracias por su pedido!`;
            ticket += `\n============================================================`;

            ticketContainer.textContent = ticket;
            ticketContainer.style.display = 'block';

            try {
                const response = await fetch('/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        cups: allCups,
                        total: total,
                        ticket: ticket,
                        customerName: customerName.trim(),
                        storeId: 'puesto2'
                    }),
                });

                if (response.ok) {
                    alert('Orden generada correctamente!');
                    // Show the New Order button and hide Submit Order button
                    document.getElementById('new-order-container').style.display = 'block';
                    document.querySelector('.btn-container').style.display = 'none';
                } else {
                    alert('Error submitting order. Please try again.');
                }
            } catch (error) {
                alert('Error submitting order. Please check if the server is running.');
            }
        }

        // Start new order
        function startNewOrder() {
            // Reset everything
            currentCupNumber = 1;
            cups = [];
            currentCup = {
                cupNumber: 1,
                items: {},
                totalScoops: 0,
                subtotal: 0
            };
            selectedFlavor = null;
            deleteModeCups.clear();

            // Reset display
            updateOrderPreview();
            displayFlavors(availableFlavors);
            document.getElementById('ticket').style.display = 'none';
            document.getElementById('new-order-container').style.display = 'none';
            document.querySelector('.btn-container').style.display = 'flex';
        }

        function handleCupClick(element, cupNumber) {
            if (element.classList.contains('delete-mode')) {
                deleteCup(cupNumber);
            } else {
                // Clear any existing delete modes first
                document.querySelectorAll('.cup-number.delete-mode').forEach(el => {
                    el.classList.remove('delete-mode');
                    el.innerHTML = `Vaso ${el.dataset.cup}`;
                });

                // Set this element to delete mode
                element.classList.add('delete-mode');
                element.innerHTML = '-'; /* ➖ */

                // Reset after 1 second if not clicked
                setTimeout(() => {
                    if (element.classList.contains('delete-mode')) {
                        element.classList.remove('delete-mode');
                        element.innerHTML = `Vaso ${cupNumber}`;
                    }
                }, 1000);
            }
        }

        function deleteCup(cupNumber) {
            // Remove from cups array
            cups = cups.filter(cup => cup.cupNumber !== cupNumber);

            // Renumber all cups consecutively starting from 1
            cups.forEach((cup, index) => {
                cup.cupNumber = index + 1;
            });

            // If it's the current cup, reset it
            if (currentCup.cupNumber === cupNumber) {
                currentCup = {
                    cupNumber: currentCupNumber,
                    items: {},
                    totalScoops: 0,
                    subtotal: 0
                };
            }

            // Update currentCupNumber to reflect the highest cup number
            if (cups.length > 0) {
                currentCupNumber = Math.max(...cups.map(cup => cup.cupNumber));
            }

            // Clear delete mode
            deleteModeCups.clear();

            // Update the display
            selectedFlavor = null;
            updateOrderPreview();
            displayFlavors(availableFlavors);
        }

        // Initialize the page
        loadFlavors();
    </script>
</body>

</html>
