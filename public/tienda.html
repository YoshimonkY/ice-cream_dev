<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - Sistema Avanzado de Heladería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            min-height: 100vh;
            padding: 5px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 5px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 7.5px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 2.5px;
            text-shadow: 0.5px 0.5px 1px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .new-cup-section {
            background: #f8f9fa;
            padding: 5px 7.5px;
            border-bottom: 0.5px solid #e9ecef;
            text-align: center;
        }

        .new-cup-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .new-cup-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.4);
        }

        .flavors-table-container {
            overflow-x: auto;
            margin: 0;
        }

        .flavors-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.1);
            border-radius: 2.5px;
            overflow: hidden;
        }

        .flavors-table th {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 3.75px 3px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9em;
        }

        .flavors-table td {
            padding: 3px;
            border-bottom: 0.25px solid #e9ecef;
            vertical-align: middle;
            text-align: center;
        }

        .flavors-table tr:hover {
            background: #f8f9fa;
        }

        .flavor-row {
            background: #fff;
            border: 0.5px solid #e0e0e0;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .flavor-row:hover {
            border-color: #ff6b6b;
            transform: translateY(-0.5px);
            box-shadow: 0 1px 3.75px rgba(0, 0, 0, 0.1);
        }

        .flavor-row.selected {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .flavor-name-cell {
            text-align: left;
            font-weight: 600;
            color: #2d3436;
            font-size: 0.95em;
            padding: 0;
            margin: 0;
        }

        .flavor-price-cell {
            font-size: 0.95em;
            color: #636e72;
        }

        .quantity-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .quantity-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 3px;
            font-size: 0.8em;
            cursor: pointer;
            transition: background 0.3s ease;
            font-weight: bold;
        }

        .quantity-btn:hover {
            background: #e55353;
        }

        .quantity-btn.undo {
            background: #6c757d;
            font-size: 1.2em;

        }

        .quantity-display {
            font-size: 1em;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #dee2e6;
        }

        .order-preview {
            background: #f8f9fa;
            border-radius: 3.75px;
            padding: 5px;
            margin-top: 7.5px;
        }

        .order-preview h3 {
            margin-bottom: 3.75px;
            color: #333;
            text-align: center;
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 5px;
            border-radius: 3px;
            font-size: 0.75em;
        }

        .order-preview-content {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 5px;
            font-size: 0.75em;
        }

        .cup-column,
        .flavors-column,
        .prices-column {
            background: white;
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #dee2e6;
        }

        .cup-column h4,
        .flavors-column h4,
        .prices-column h4 {
            background: #ff6b6b;
            color: white;
            margin: -5px -5px 5px -5px;
            padding: 3px;
            text-align: center;
            font-size: 0.8em;
            border-radius: 2px 2px 0 0;
        }

        .cup-item,
        .flavor-item,
        .price-item {
            padding: 2px;
            margin-bottom: 2px;
            border-radius: 2px;
        }

        .cup-item {
            background: #fff3cd;
            border-left: 3px solid #ffc107;
        }

        .flavor-item {
            background: #d1ecf1;
            border-left: 3px solid #17a2b8;
        }

        .price-item {
            background: #d4edda;
            border-left: 3px solid #28a745;
            font-weight: bold;
        }

        .empty-cup {
            color: #6c757d;
            font-style: italic;
            text-align: center;
            padding: 5px;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            border: none;
            padding: 3.75px 7.5px;
            border-radius: 6.25px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 2.5px;
            min-width: 150px;
        }

        .btn:hover {
            transform: translateY(-0.5px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 5px;
        }

        .btn-container .btn {
            flex: 1;
            max-width: 200px;
        }

        .ticket {
            background: white;
            border: 0.5px dashed #ff6b6b;
            border-radius: 3.75px;
            padding: 5px;
            margin-top: 5px;
            font-family: monospace;
            white-space: pre-line;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: #636e72;
            font-size: 1.1em;
        }

        .current-cup-indicator {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
            color: white;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 1em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 5px;
        }

        @media (max-width: 768px) {
            .flavors-table-container {
                overflow-x: auto;
            }

            .flavors-table {
                min-width: 100px;
                /* FAQ */
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }

            .btn-container .btn {
                width: 100%;
                max-width: 250px;
            }

            h1 {
                font-size: 2em;
            }

            .flavor-name-cell {
                font-size: 0.8em;
            }

            .flavor-price-cell {
                font-size: 0.8em;
            }

            .quantity-cell {
                gap: 1px;
            }

            .quantity-btn {
                width: 35px;
                height: 35px;
                font-size: 0.9em;
            }

            .quantity-display {
                font-size: 0.9em;
                min-width: 18px;
            }

            .flavors-table th {
                font-size: 0.75em;
                padding: 2px 1px;
            }

            .flavors-table td {
                font-size: 1em;
                padding: 2px;
            }

            .order-preview-content {
                grid-template-columns: 1fr;
                gap: 3px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h3>🍨 Tienda </h3>
        </div>

        <div class="new-cup-section">
            <div class="current-cup-indicator" id="current-cup-indicator"> Vaso #1</div>
            <button class="new-cup-btn" onclick="createNewCup()">➕🍧</button>
        </div>

        <div id="flavors-container">
            <div class="loading" id="loading">Loading flavors...</div>
        </div>

        <div class="order-preview">
            <h3> Pedido 📋</h3>
            <div class="order-preview-content" id="order-preview-content">
                <div class="cup-column">
                    <h4>Vasos</h4>
                    <div class="empty-cup">Sin vasos</div>
                </div>
                <div class="flavors-column">
                    <h4>Sabores</h4>
                    <div class="empty-cup">Sin sabores</div>
                </div>
                <div class="prices-column">
                    <h4>Precios</h4>
                    <div class="empty-cup">Sin precios</div>
                </div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="submitOrder()">Submit Order</button>
        </div>

        <div class="btn-container" id="new-order-container" style="display: none;">
            <button class="btn" onclick="startNewOrder()">New Order</button>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="window.location.href='orders.html'">View Order History</button>
            <button class="btn" onclick="window.location.href='inventory.html'"
                style="background: linear-gradient(135deg, #667eea, #764ba2);">📦 Manage Inventory</button>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="window.location.href='inventory.html'"
                style="background: linear-gradient(135deg, #ffc107, #fd7e14);">⚙️ Configure Tienda Flavors</button>
        </div>

        <div class="ticket" id="ticket" style="display: none;"></div>
    </div>

    <script>
        let currentCupNumber = 1;
        let cups = [];
        let currentCup = {
            cupNumber: 1,
            items: {},
            totalScoops: 0,
            subtotal: 0
        };
        let availableFlavors = [];
        let lastAction = null; // Track last action for undo

        // Load flavors from tienda store
        async function loadFlavors() {
            try {
                const response = await fetch('/store-flavors/tienda');
                const flavors = await response.json();

                if (!response.ok) {
                    throw new Error(flavors.error || 'Error loading flavors');
                }

                // Filter only active flavors for this store
                availableFlavors = flavors.filter(flavor => flavor.store_active);
                displayFlavors(availableFlavors);

                if (availableFlavors.length === 0) {
                    document.getElementById('loading').innerHTML = 'No active flavors available for this store. Please check inventory and enable flavors for Tienda Avanzada.';
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading flavors: ' + error.message;
                console.error('Error loading flavors:', error);
            }
        }

        // Display flavors in table format
        function displayFlavors(flavors) {
            const container = document.getElementById('flavors-container');

            if (flavors.length === 0) {
                container.innerHTML = '<div class="loading">No flavors available</div>';
                return;
            }

            let html = `
                <div class="flavors-table-container">
                    <table class="flavors-table">
                        <thead>
                            <tr>
                                <th style="width: 50%;">Helado de:</th>
                                <th style="width: 30%;">Cantidad</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            flavors.forEach(flavor => {
                const currentQuantity = currentCup.items[flavor.name]?.quantity || 0;

                html += `
                    <tr class="flavor-row" data-flavor="${flavor.name}" data-price="${flavor.price}" data-id="${flavor.id}">
                        <td class="flavor-name-cell">${flavor.name}</td>
                        <td class="quantity-cell">
                            <button class="quantity-btn undo" onclick="undoLastAction('${flavor.name}')" title="Undo last addition">↩️</button>
                            <button class="quantity-btn" onclick="changeQuantity('${flavor.name}', 1)">+1</button>
                            <button class="quantity-btn" onclick="changeQuantity('${flavor.name}', 3)">+3</button>
                            <button class="quantity-btn" onclick="changeQuantity('${flavor.name}', 6)">+6</button>
                            <span class="quantity-display">${currentQuantity}</span>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
            updateCurrentCupIndicator();
            updateOrderPreview();
        }

        // Change quantity with enhanced controls
        function changeQuantity(flavor, amount) {
            const price = availableFlavors.find(f => f.name === flavor)?.price || 0;
            const currentQuantity = currentCup.items[flavor]?.quantity || 0;
            const newQuantity = Math.max(0, currentQuantity + amount);

            // Check if this would exceed 6 scoops per cup
            const totalScoopsAfter = currentCup.totalScoops - currentQuantity + newQuantity;
            if (totalScoopsAfter > 6) {
                alert(`Maximum 6 scoops per cup! Current cup has ${currentCup.totalScoops} scoops.`);
                return;
            }

            // Track last action for undo
            lastAction = {
                flavor: flavor,
                previousQuantity: currentQuantity,
                newQuantity: newQuantity,
                amount: amount
            };

            // Update current cup
            if (newQuantity > 0) {
                currentCup.items[flavor] = { flavor, quantity: newQuantity, price };
            } else {
                delete currentCup.items[flavor];
            }

            currentCup.totalScoops = totalScoopsAfter;
            currentCup.subtotal = calculateCupSubtotal();

            // Auto-create new cup if current cup reaches 6 scoops
            if (currentCup.totalScoops >= 6) {
                createNewCup();
            }

            displayFlavors(availableFlavors);
        }

        // Undo last action
        function undoLastAction(flavor) {
            if (!lastAction || lastAction.flavor !== flavor) {
                return;
            }

            const { flavor: actionFlavor, previousQuantity } = lastAction;

            // Restore previous quantity
            if (previousQuantity > 0) {
                const price = availableFlavors.find(f => f.name === actionFlavor)?.price || 0;
                currentCup.items[actionFlavor] = { flavor: actionFlavor, quantity: previousQuantity, price };
            } else {
                delete currentCup.items[actionFlavor];
            }

            currentCup.totalScoops = calculateCupTotalScoops();
            currentCup.subtotal = calculateCupSubtotal();

            lastAction = null;
            displayFlavors(availableFlavors);
        }

        // Create new cup
        function createNewCup() {
            if (currentCup.totalScoops > 0) {
                // Save current cup to cups array
                cups.push({ ...currentCup });
                currentCupNumber++;
            }

            // Initialize new cup
            currentCup = {
                cupNumber: currentCupNumber,
                items: {},
                totalScoops: 0,
                subtotal: 0
            };

            lastAction = null;
            displayFlavors(availableFlavors);
        }

        // Calculate cup subtotal
        function calculateCupSubtotal() {
            return Object.values(currentCup.items).reduce((sum, item) => {
                return sum + (item.quantity * item.price);
            }, 0);
        }

        // Calculate total scoops in current cup
        function calculateCupTotalScoops() {
            return Object.values(currentCup.items).reduce((sum, item) => {
                return sum + item.quantity;
            }, 0);
        }

        // Update current cup indicator
        function updateCurrentCupIndicator() {
            const indicator = document.getElementById('current-cup-indicator');
            indicator.textContent = `🍧#${currentCup.cupNumber} (${currentCup.totalScoops} / 6🍨)`;
        }

        // Update order preview
        function updateOrderPreview() {
            const previewContent = document.getElementById('order-preview-content');

            // Combine all cups (including current) for preview
            const allCups = [...cups];
            if (currentCup.totalScoops > 0) {
                allCups.push({ ...currentCup });
            }

            if (allCups.length === 0) {
                previewContent.innerHTML = `
                    <div class="cup-column">
                        <h4>Vasos</h4>
                        <div class="empty-cup">Sin vasos</div>
                    </div>
                    <div class="flavors-column">
                        <h4>Sabores</h4>
                        <div class="empty-cup">Sin sabores</div>
                    </div>
                    <div class="prices-column">
                        <h4>Precios</h4>
                        <div class="empty-cup">Sin precios</div>
                    </div>
                `;
                return;
            }

            let cupsHtml = '<h4>Vasos</h4>';
            let flavorsHtml = '<h4>Sabores</h4>';
            let pricesHtml = '<h4>Precios</h4>';

            allCups.forEach((cup, index) => {
                cupsHtml += `<div class="cup-item">🍨 Vaso #${cup.cupNumber}</div>`;

                const flavorBreakdown = Object.values(cup.items).map(item =>
                    `${item.flavor} (${item.quantity})`
                ).join(', ');

                flavorsHtml += `<div class="flavor-item">${flavorBreakdown || 'Vacío'}</div>`;
                pricesHtml += `<div class="price-item">$${cup.subtotal.toFixed(2)}</div>`;
            });

            previewContent.innerHTML = `
                <div class="cup-column">${cupsHtml}</div>
                <div class="flavors-column">${flavorsHtml}</div>
                <div class="prices-column">${pricesHtml}</div>
            `;
        }

        // Submit order with customer name prompt
        async function submitOrder() {
            // Check if there's anything to order
            const allCups = [...cups];
            if (currentCup.totalScoops > 0) {
                allCups.push({ ...currentCup });
            }

            if (allCups.length === 0) {
                alert('Please add at least one scoop to submit the order.');
                return;
            }

            // Prompt for customer name
            const customerName = prompt('Ingrese el nombre del cliente:');
            if (!customerName || customerName.trim() === '') {
                alert('Customer name is required.');
                return;
            }

            // Calculate total
            const total = allCups.reduce((sum, cup) => sum + cup.subtotal, 0);

            // Generate enhanced ticket
            const ticketContainer = document.getElementById('ticket');
            const timestamp = new Date().toLocaleString();

            let ticket = `🍨 TIENDA - PEDIDO AVANZADO 🍨
============================================================
${timestamp}
Cliente: ${customerName}
============================================================`;

            allCups.forEach((cup, index) => {
                ticket += `\n🍨 VASO #${cup.cupNumber} (Total: $${cup.subtotal.toFixed(2)})`;
                ticket += `\n------------------------------------------------------------`;

                Object.values(cup.items).forEach(item => {
                    ticket += `\n${item.flavor} (${item.quantity} scoops) - $${(item.quantity * item.price).toFixed(2)}`;
                });

                if (Object.keys(cup.items).length === 0) {
                    ticket += `\nVacío`;
                }
            });

            ticket += `\n============================================================`;
            ticket += `\nTOTAL GENERAL: $${total.toFixed(2)}`;
            ticket += `\n\n¡Gracias por su pedido!`;
            ticket += `\n============================================================`;

            ticketContainer.textContent = ticket;
            ticketContainer.style.display = 'block';

            try {
                const response = await fetch('/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        cups: allCups,
                        total: total,
                        ticket: ticket,
                        customerName: customerName.trim(),
                        storeId: 'tienda'
                    }),
                });

                if (response.ok) {
                    alert('Order submitted successfully!');
                    // Show the New Order button and hide Submit Order button
                    document.getElementById('new-order-container').style.display = 'block';
                    document.querySelector('.btn-container').style.display = 'none';
                } else {
                    alert('Error submitting order. Please try again.');
                }
            } catch (error) {
                alert('Error submitting order. Please check if the server is running.');
            }
        }

        // Start new order
        function startNewOrder() {
            // Reset everything
            currentCupNumber = 1;
            cups = [];
            currentCup = {
                cupNumber: 1,
                items: {},
                totalScoops: 0,
                subtotal: 0
            };
            lastAction = null;

            // Reset display
            displayFlavors(availableFlavors);
            document.getElementById('ticket').style.display = 'none';
            document.getElementById('new-order-container').style.display = 'none';
            document.querySelector('.btn-container').style.display = 'flex';
        }

        // Initialize the page
        loadFlavors();
    </script>
</body>

</html>
