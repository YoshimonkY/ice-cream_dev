<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - Ice Cream App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }


        .orders-container {
            display: grid;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            transition: transform 0.3s ease;
        }

        .order-card:hover {
            transform: translateY(-2px);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .order-id {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }

        .order-timestamp {
            color: #666;
            font-size: 0.9em;
        }

        .order-total {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .order-items {
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-flavor {
            font-weight: 500;
        }

        .item-quantity {
            color: #667eea;
            font-weight: bold;
        }

        .item-price {
            color: #333;
        }

        .order-ticket {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.9em;
            white-space: pre-line;
            border-left: 4px solid #667eea;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #e74c3c;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 500;
            color: #333;
        }

        .control-group input[type="radio"] {
            margin: 0 5px;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .control-group {
                justify-content: center;
            }

            h1 {
                font-size: 2em;
            }

            .order-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📋 Order History</h1>

        <div class="controls">
            <div class="control-group">
                <label for="order-limit">Show:</label>
                <select id="order-limit" class="btn"
                    style="margin: 0 10px; padding: 8px; border-radius: 15px; border: none; background: #f8f9fa;">
                    <option value="20">Last 20 orders</option>
                    <option value="50">Last 50 orders</option>
                    <option value="100">Last 100 orders</option>
                </select>
            </div>

            <div class="control-group">
                <label>Order:</label>
                <label><input type="radio" name="order-direction" value="DESC" checked> Newest First</label>
                <label><input type="radio" name="order-direction" value="ASC"> Oldest First</label>
            </div>

            <button class="btn" onclick="loadOrders()">Load Orders</button>
            <button class="btn" onclick="window.location.href='/'">New Order</button>
            <button class="btn" onclick="window.location.href='all-orders.html'">All Orders List</button>
        </div>

        <div id="orders-container" class="orders-container">
            <div class="loading">Loading orders...</div>
        </div>

        <div class="controls" style="margin-top: 40px; padding-top: 20px; border-top: 2px solid #667eea;">
            <button class="btn" onclick="window.location.href='/'">New Order</button>
        </div>
    </div>

    <script>
        async function loadOrders() {
            const container = document.getElementById('orders-container');
            const limit = document.getElementById('order-limit').value;
            const orderDirection = document.querySelector('input[name="order-direction"]:checked').value;

            container.innerHTML = '<div class="loading">Loading orders...</div>';

            try {
                const response = await fetch(`/orders?limit=${limit}&order=${orderDirection}`);
                const orders = await response.json();

                if (orders.length === 0) {
                    container.innerHTML = '<div class="error">No orders found.</div>';
                    return;
                }

                container.innerHTML = '';

                orders.forEach(order => {
                    const orderCard = document.createElement('div');
                    orderCard.className = 'order-card';

                    const orderHeader = document.createElement('div');
                    orderHeader.className = 'order-header';

                    const orderId = document.createElement('div');
                    orderId.className = 'order-id';
                    orderId.textContent = `Order #${order.id}`;

                    const orderTimestamp = document.createElement('div');
                    orderTimestamp.className = 'order-timestamp';
                    orderTimestamp.textContent = new Date(order.timestamp).toLocaleString();

                    const orderTotal = document.createElement('div');
                    orderTotal.className = 'order-total';
                    orderTotal.textContent = `Total: $${order.total.toFixed(2)}`;

                    orderHeader.appendChild(orderId);
                    orderHeader.appendChild(orderTimestamp);
                    orderHeader.appendChild(orderTotal);

                    const orderItems = document.createElement('div');
                    orderItems.className = 'order-items';

                    order.items.forEach(item => {
                        const orderItem = document.createElement('div');
                        orderItem.className = 'order-item';

                        const itemFlavor = document.createElement('span');
                        itemFlavor.className = 'item-flavor';
                        itemFlavor.textContent = item.flavor;

                        const itemQuantity = document.createElement('span');
                        itemQuantity.className = 'item-quantity';
                        itemQuantity.textContent = `${item.quantity} scoops`;

                        const itemPrice = document.createElement('span');
                        itemPrice.className = 'item-price';
                        itemPrice.textContent = `$${item.price.toFixed(2)}`;

                        orderItem.appendChild(itemFlavor);
                        orderItem.appendChild(itemQuantity);
                        orderItem.appendChild(itemPrice);

                        orderItems.appendChild(orderItem);
                    });

                    const orderTicket = document.createElement('div');
                    orderTicket.className = 'order-ticket';
                    orderTicket.textContent = order.ticket;

                    orderCard.appendChild(orderHeader);
                    orderCard.appendChild(orderItems);
                    orderCard.appendChild(orderTicket);

                    container.appendChild(orderCard);
                });

            } catch (error) {
                container.innerHTML = '<div class="error">Error loading orders. Please check if the server is running.</div>';
            }
        }

        // Load orders when page loads
        window.onload = loadOrders;
    </script>
</body>

</html>
