<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puesto - Heladería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
            padding: 5px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 7.5px;
            font-size: 2.5em;
        }

        .flavor-section {
            margin-bottom: 7.5px;
        }

        .flavor-section h2 {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            padding: 3.75px;
            border-radius: 3.75px;
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .flavors-table-container {
            overflow-x: auto;
            margin-bottom: 5px;
        }

        .flavors-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 1px 1.5px rgba(0, 0, 0, 0.1);
            border-radius: 2.5px;
            overflow: hidden;
        }

        .flavors-table th {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 3.75px 3px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9em;
        }

        .flavors-table td {
            padding: 3px;
            border-bottom: 0.25px solid #e9ecef;
            vertical-align: middle;
            text-align: center;
        }

        .flavors-table tr:hover {
            background: #f8f9fa;
        }

        .flavor-row {
            background: #fff;
            border: 0.5px solid #e0e0e0;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .flavor-row:hover {
            border-color: #ff6b6b;
            transform: translateY(-0.5px);
            box-shadow: 0 1px 3.75px rgba(0, 0, 0, 0.1);
        }

        .flavor-row.selected {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .flavor-name-cell {
            text-align: left;
            font-weight: 600;
            color: #2d3436;
            font-size: 0.95em;
        }

        .flavor-price-cell {
            font-size: 0.9em;
            color: #666;
        }

        .quantity-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7.5px;
        }

        .quantity-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .quantity-btn:hover {
            background: #e55353;
        }

        .quantity-display {
            font-size: 1em;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .order-summary {
            background: #f8f9fa;
            border-radius: 3.75px;
            padding: 5px;
            margin-top: 7.5px;
        }

        .order-summary h3 {
            margin-bottom: 3.75px;
            color: #333;
            text-align: center;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2.5px;
            padding: 2.5px;
            background: white;
            border-radius: 2.5px;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 3.75px;
            padding-top: 3.75px;
            border-top: 0.5px solid #ff6b6b;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            border: none;
            padding: 3.75px 7.5px;
            border-radius: 6.25px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 2.5px;
            min-width: 150px;
        }

        .btn:hover {
            transform: translateY(-0.5px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 5px;
        }

        .btn-container .btn {
            flex: 1;
            max-width: 200px;
        }

        .ticket {
            background: white;
            border: 0.5px dashed #ff6b6b;
            border-radius: 3.75px;
            padding: 5px;
            margin-top: 5px;
            font-family: monospace;
            white-space: pre-line;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: #636e72;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .flavors-table-container {
                overflow-x: auto;
            }

            .flavors-table {
                min-width: 500px;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }

            h1 {
                font-size: 2em;
            }

            .flavor-name-cell {
                font-size: 0.8em;
            }

            .flavor-price-cell {
                font-size: 0.8em;
            }

            .quantity-btn {
                width: 20px;
                height: 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🥤 Puesto - Ice Cream Orders</h1>

        <div id="flavors-container">
            <div class="loading" id="loading">Loading flavors...</div>
        </div>

        <div class="order-summary">
            <h3>Your Order</h3>
            <div id="order-items"></div>
            <div class="order-total">
                <span>Total: $<span id="order-total">0.00</span></span>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="submitOrder()">Submit Order</button>
        </div>

        <div class="btn-container" id="new-order-container" style="display: none;">
            <button class="btn" onclick="startNewOrder()">New Order</button>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="window.location.href='orders.html'">View Order History</button>
            <button class="btn" onclick="window.location.href='inventory.html'"
                style="background: linear-gradient(135deg, #667eea, #764ba2);">📦 Manage Inventory</button>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="window.location.href='tienda.html'"
                style="background: linear-gradient(135deg, #28a745, #20c997);">🏪 Advanced Store</button>
        </div>

        <div class="ticket" id="ticket" style="display: none;"></div>
    </div>

    <script>
        let orderItems = {};
        let availableFlavors = [];

        // Load flavors from puesto store
        async function loadFlavors() {
            try {
                const response = await fetch('/store-flavors/puesto');
                const flavors = await response.json();

                if (!response.ok) {
                    throw new Error(flavors.error || 'Error loading flavors');
                }

                // Filter only active flavors for this store
                availableFlavors = flavors.filter(flavor => flavor.store_active);
                displayFlavors(availableFlavors);

                if (availableFlavors.length === 0) {
                    document.getElementById('loading').innerHTML = 'No active flavors available for this store. Please check inventory.';
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading flavors: ' + error.message;
                console.error('Error loading flavors:', error);
            }
        }

        // Display flavors dynamically
        function displayFlavors(flavors) {
            const container = document.getElementById('flavors-container');

            if (flavors.length === 0) {
                container.innerHTML = '<div class="loading">No flavors available</div>';
                return;
            }

            let html = `
                <div class="flavors-table-container">
                    <table class="flavors-table">
                        <thead>
                            <tr>
                                <th style="width: 40%;">Flavor</th>
                                <th style="width: 20%;">Price</th>
                                <th style="width: 40%;">Quantity</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            flavors.forEach(flavor => {
                html += `
                    <tr class="flavor-row" data-flavor="${flavor.name}" data-price="${flavor.price}" data-id="${flavor.id}">
                        <td class="flavor-name-cell">${flavor.name}</td>
                        <td class="flavor-price-cell">$${flavor.price.toFixed(2)}</td>
                        <td class="quantity-cell">
                            <button class="quantity-btn" onclick="changeQuantity(this, -1)">-</button>
                            <span class="quantity-display">0</span>
                            <button class="quantity-btn" onclick="changeQuantity(this, 1)">+</button>
                        </td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        function changeQuantity(button, change) {
            const flavorRow = button.closest('.flavor-row');
            const quantityDisplay = flavorRow.querySelector('.quantity-display');
            const flavor = flavorRow.dataset.flavor;
            const price = parseFloat(flavorRow.dataset.price);

            let currentQuantity = parseInt(quantityDisplay.textContent);
            currentQuantity = Math.max(0, currentQuantity + change);

            quantityDisplay.textContent = currentQuantity;

            if (currentQuantity > 0) {
                orderItems[flavor] = { flavor, quantity: currentQuantity, price };
                flavorRow.classList.add('selected');
            } else {
                delete orderItems[flavor];
                flavorRow.classList.remove('selected');
            }

            updateOrderSummary();
        }

        function updateOrderSummary() {
            const orderItemsContainer = document.getElementById('order-items');
            const orderTotalElement = document.getElementById('order-total');

            orderItemsContainer.innerHTML = '';

            let total = 0;
            Object.values(orderItems).forEach(item => {
                const itemTotal = item.quantity * item.price;
                total += itemTotal;

                const orderItem = document.createElement('div');
                orderItem.className = 'order-item';
                orderItem.innerHTML = `
                    <span>${item.flavor} (${item.quantity} scoops)</span>
                    <span>$${itemTotal.toFixed(2)}</span>
                `;
                orderItemsContainer.appendChild(orderItem);
            });

            orderTotalElement.textContent = total.toFixed(2);
        }

        async function submitOrder() {
            const total = parseFloat(document.getElementById('order-total').textContent);
            if (total === 0) {
                alert('Please select at least one item to submit the order.');
                return;
            }

            // Generate ticket automatically before submitting
            const ticketContainer = document.getElementById('ticket');
            const timestamp = new Date().toLocaleString();

            let ticket = `🥤 PUESTO - ICE CREAM ORDER TICKET 🥤
=======================================
${timestamp}
---------------------------------------`;

            Object.values(orderItems).forEach(item => {
                ticket += `${item.flavor} (${item.quantity} scoops) - $${(item.quantity * item.price).toFixed(2)}\n`;
            });

            ticket += `---------------------------------------
TOTAL: $${total.toFixed(2)}

Thank you for your order!
=======================================`;

            ticketContainer.textContent = ticket;
            ticketContainer.style.display = 'block';

            const items = Object.values(orderItems);

            try {
                const response = await fetch('/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ items, total, ticket }),
                });

                if (response.ok) {
                    alert('Order submitted successfully!');
                    // Show the New Order button and hide Submit Order button
                    document.getElementById('new-order-container').style.display = 'block';
                    document.querySelector('.btn-container').style.display = 'none';
                } else {
                    alert('Error submitting order. Please try again.');
                }
            } catch (error) {
                alert('Error submitting order. Please check if the server is running.');
            }
        }

        function startNewOrder() {
            // Reset the form
            document.querySelectorAll('.quantity-display').forEach(display => {
                display.textContent = '0';
            });
            document.querySelectorAll('.flavor-row').forEach(row => {
                row.classList.remove('selected');
            });
            orderItems = {};
            updateOrderSummary();

            // Hide the ticket and New Order button, show Submit Order button
            document.getElementById('ticket').style.display = 'none';
            document.getElementById('new-order-container').style.display = 'none';
            document.querySelector('.btn-container').style.display = 'flex';
        }

        // Initialize the page
        loadFlavors();
    </script>
</body>

</html>
