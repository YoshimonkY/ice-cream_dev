<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puesto - Heladería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: rgb(22, 165, 9);
            padding: 0px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 100%;
            /*FAQ*/
            width: 100%;
            text-align: center;
            /* background: rgb(22, 165, 9);
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1); */
            padding: 0px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 7.5px;
            font-size: 2.5em;
        }

        .flavor-section {
            margin-bottom: 7.5px;
        }

        .flavor-section h2 {
            /* background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white; */
            padding: 3.75px;
            border-radius: 3.75px;
            text-align: center;
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .flavors-buttons-container {
            /* min-width: 350px; */
            /*FAQ*/
            /* background: rgb(38, 0, 255); */
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .flavors-column {
            max-width: 400px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: transparent;
            /* Add this line */
        }

        .flavor-btn {
            background: #66e634;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px 5px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .flavor-btn:hover {
            border-color: #ff6b6b;
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .flavor-btn.active {
            border-color: #ff6b6b;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .flavor-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .flavor-name {
            font-size: 0.9em;
            margin-bottom: 2px;
        }

        .flavor-price {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .quantity-controls-section {
            background: #f8f9fa;
            padding: 5px 7.5px;
            border-radius: 5px;
            margin-bottom: 5px;
            text-align: center;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .undo-btn {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .undo-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #5a6268, #495057);
            transform: translateY(-1px);
        }

        .undo-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quantity-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .quantity-btn:hover {
            background: linear-gradient(135deg, #e55353, #dc3545);
            transform: translateY(-1px);
        }

        .quantity-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .order-preview {
            background: #f8f9fa;
            border-radius: 3.75px;
            padding: 5px;
            margin-top: 7.5px;
        }

        .order-preview h3 {
            margin-bottom: 3.75px;
            color: #333;
            text-align: center;
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 5px;
            border-radius: 3px;
            font-size: 1.1em;
        }

        .order-preview-content {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 5px;
            font-size: 0.9em;
            font-family: monospace;
        }

        .cup-column,
        .flavors-column,
        .prices-column {
            background: white;
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #dee2e6;
        }

        .cup-column h4,
        .flavors-column h4,
        .prices-column h4 {
            background: #ff6b6b;
            color: white;
            margin: -5px -5px 5px -5px;
            padding: 3px;
            text-align: center;
            font-size: 0.8em;
            border-radius: 2px 2px 0 0;
        }

        .cup-item,
        .flavor-item,
        .price-item {
            padding: 2px;
            margin-bottom: 2px;
            border-radius: 2px;
        }

        .cup-item {
            background: #fff3cd;
            border-left: 3px solid #ffc107;
        }

        .flavor-item {
            background: #d1ecf1;
            border-left: 3px solid #17a2b8;
        }

        .price-item {
            background: #d4edda;
            border-left: 3px solid #28a745;
            font-weight: bold;
        }

        .empty-cup {
            color: #6c757d;
            font-style: italic;
            text-align: center;
            padding: 5px;
        }

        .current-cup-indicator {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
            color: white;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 5px;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            border: none;
            padding: 3.75px 7.5px;
            border-radius: 6.25px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 2.5px;
            min-width: 150px;
        }

        .btn:hover {
            transform: translateY(-0.5px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 5px;
        }

        .btn-container .btn {
            flex: 1;
            max-width: 200px;
        }

        .ticket {
            background: white;
            border: 0.5px dashed #ff6b6b;
            border-radius: 3.75px;
            padding: 5px;
            margin-top: 5px;
            font-family: monospace;
            white-space: pre-line;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: #636e72;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .flavors-buttons-container {
                flex-direction: row;
                gap: 2px;
                min-width: unset;
                width: 100%;
                /*FAQ*/
            }

            .flavors-column {
                min-width: calc(50% - 1px);
                background: transparent;
                /* FAQ */
                border: none;
                /* Set minimum width to half container minus gap */
                gap: 2px;
            }

            .flavor-btn {
                min-height: 40px;
                font-size: 1.2em;
            }

            .flavor-name {
                font-size: 0.8em;
            }

            .flavor-price {
                font-size: 0.7em;
            }

            .quantity-controls {
                gap: 3px;
            }

            .undo-btn,
            .quantity-btn {
                width: 50px;
                height: 50px;
                font-size: 1em;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
            }

            .btn-container .btn {
                width: 100%;
                max-width: 250px;
            }

            h1 {
                font-size: 2em;
            }

            .order-preview-content {
                grid-template-columns: 1fr;
                gap: 3px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>Puesto</h3>

        <div class="new-cup-section">
            <div class="current-cup-indicator" id="current-cup-indicator">🍨 Vaso #1</div>
            <button class="new-cup-btn" onclick="createNewCup()">➕ Nuevo Vaso</button>
        </div>

        <div id="flavors-container">
            <div class="loading" id="loading">Loading flavors...</div>
        </div>

        <div class="quantity-controls-section">
            <div class="quantity-controls">
                <button class="undo-btn" onclick="undoLastAction()" id="undo-btn" disabled>↺</button>
                <button class="quantity-btn" onclick="addScoops(1)">+1</button>
                <button class="quantity-btn" onclick="addScoops(3)">+3</button>
                <button class="quantity-btn" onclick="addScoops(6)">+6</button>
            </div>
        </div>

        <div class="order-preview">

            <div class="order-preview-content" id="order-preview-content">
                <div class="cup-column">
                    <h4>Vasos</h4>
                    <div class="empty-cup">Sin vasos</div>
                </div>
                <div class="flavors-column">
                    <h4>Sabores</h4>
                    <div class="empty-cup">Sin sabores</div>
                </div>
                <div class="prices-column">
                    <h4>Precios</h4>
                    <div class="empty-cup">Sin precios</div>
                </div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="submitOrder()">Submit Order</button>
        </div>

        <div class="btn-container" id="new-order-container" style="display: none;">
            <button class="btn" onclick="startNewOrder()">New Order</button>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="window.location.href='orders.html'">View Order History</button>
            <button class="btn" onclick="window.location.href='inventory.html'"
                style="background: linear-gradient(135deg, #667eea, #764ba2);">📦 Manage Inventory</button>
        </div>

        <div class="btn-container">
            <button class="btn" onclick="window.location.href='tienda.html'"
                style="background: linear-gradient(135deg, #28a745, #20c997);">🏪 Advanced Store</button>
        </div>

        <div class="ticket" id="ticket" style="display: none;"></div>
    </div>

    <script>
        let currentCupNumber = 1;
        let cups = [];
        let currentCup = {
            cupNumber: 1,
            items: {},
            totalScoops: 0,
            subtotal: 0
        };
        let availableFlavors = [];
        let selectedFlavor = null;
        let actionHistory = [];

        // Load flavors from puesto store
        async function loadFlavors() {
            try {
                const response = await fetch('/store-flavors/puesto');
                const flavors = await response.json();

                if (!response.ok) {
                    throw new Error(flavors.error || 'Error loading flavors');
                }

                // Filter only active flavors for this store
                availableFlavors = flavors.filter(flavor => flavor.store_active);
                displayFlavors(availableFlavors);

                if (availableFlavors.length === 0) {
                    document.getElementById('loading').innerHTML = 'No active flavors available for this store. Please check inventory.';
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = 'Error loading flavors: ' + error.message;
                console.error('Error loading flavors:', error);
            }
        }

        // Display flavors in two-column button layout
        function displayFlavors(flavors) {
            const container = document.getElementById('flavors-container');

            if (flavors.length === 0) {
                container.innerHTML = '<div class="loading">No flavors available</div>';
                return;
            }

            // Split flavors into two columns
            const midPoint = Math.ceil(flavors.length / 2);
            const leftColumn = flavors.slice(0, midPoint);
            const rightColumn = flavors.slice(midPoint);

            let html = '<div class="flavors-buttons-container">';

            // Left column
            html += '<div class="flavors-column">';
            leftColumn.forEach(flavor => {
                const isActive = selectedFlavor === flavor.name;
                html += `
                    <button class="flavor-btn ${isActive ? 'active' : ''}"
                            onclick="selectFlavor('${flavor.name}')"
                            data-flavor="${flavor.name}">
                        <div class="flavor-name">${flavor.name}</div>
                        
                    </button>
                `;
            });
            html += '</div>';

            // Right column
            html += '<div class="flavors-column">';
            rightColumn.forEach(flavor => {
                const isActive = selectedFlavor === flavor.name;
                html += `
                    <button class="flavor-btn ${isActive ? 'active' : ''}"
                            onclick="selectFlavor('${flavor.name}')"
                            data-flavor="${flavor.name}">
                        <div class="flavor-name">${flavor.name}</div>
                        
                    </button>
                `;
            });
            html += '</div>';

            html += '</div>';
            container.innerHTML = html;
            updateUndoButton();
            updateCurrentCupIndicator();
        }

        // Select flavor (only one can be active)
        function selectFlavor(flavorName) {
            selectedFlavor = flavorName;
            displayFlavors(availableFlavors);
        }

        // Add scoops to selected flavor
        function addScoops(amount) {
            if (!selectedFlavor) {
                alert('Habilita un sabor primero!');
                return;
            }

            const flavor = availableFlavors.find(f => f.name === selectedFlavor);
            if (!flavor) return;

            const currentQuantity = currentCup.items[selectedFlavor]?.quantity || 0;
            const newQuantity = currentQuantity + amount;

            // Check if this would exceed 6 scoops per cup
            const totalScoopsAfter = currentCup.totalScoops - currentQuantity + newQuantity;
            if (totalScoopsAfter > 6) {
                alert(`Maximo 6 bolas por vaso. Ahora hay ${currentCup.totalScoops} bolas en el vaso.`);
                return;
            }

            // Track action for undo
            actionHistory.push({
                flavor: selectedFlavor,
                previousQuantity: currentQuantity,
                newQuantity: newQuantity,
                amount: amount,
                timestamp: Date.now()
            });

            // Keep only last 12 actions
            if (actionHistory.length > 12) {
                actionHistory = actionHistory.slice(-12);
            }

            // Update current cup
            if (newQuantity > 0) {
                currentCup.items[selectedFlavor] = { flavor: selectedFlavor, quantity: newQuantity, price: flavor.price };
            } else {
                delete currentCup.items[selectedFlavor];
            }

            currentCup.totalScoops = totalScoopsAfter;
            currentCup.subtotal = calculateCupSubtotal();

            // Auto-create new cup if current cup reaches 6 scoops
            if (currentCup.totalScoops >= 6) {
                createNewCup();
            }

            displayFlavors(availableFlavors);
            updateCurrentCupIndicator();
            updateOrderPreview();
        }

        // Undo last action
        function undoLastAction() {
            if (actionHistory.length === 0) return;

            const lastAction = actionHistory.pop();
            const { flavor, previousQuantity } = lastAction;

            // Restore previous quantity
            const flavorData = availableFlavors.find(f => f.name === flavor);
            if (previousQuantity > 0 && flavorData) {
                currentCup.items[flavor] = { flavor, quantity: previousQuantity, price: flavorData.price };
            } else {
                delete currentCup.items[flavor];
            }

            currentCup.totalScoops = calculateCupTotalScoops();
            currentCup.subtotal = calculateCupSubtotal();

            displayFlavors(availableFlavors);
            updateOrderPreview();
            updateUndoButton();
        }

        // Update undo button state
        function updateUndoButton() {
            const undoBtn = document.getElementById('undo-btn');
            undoBtn.disabled = actionHistory.length === 0;
        }

        // Create new cup
        function createNewCup() {
            if (currentCup.totalScoops > 0) {
                // Save current cup to cups array
                cups.push({ ...currentCup });
                currentCupNumber++;
            }

            // Initialize new cup
            currentCup = {
                cupNumber: currentCupNumber,
                items: {},
                totalScoops: 0,
                subtotal: 0
            };

            selectedFlavor = null;
            actionHistory = [];
            displayFlavors(availableFlavors);
            updateOrderPreview();
        }

        // Calculate cup subtotal
        function calculateCupSubtotal() {
            return Object.values(currentCup.items).reduce((sum, item) => {
                return sum + (item.quantity * item.price);
            }, 0);
        }

        // Calculate total scoops in current cup
        function calculateCupTotalScoops() {
            return Object.values(currentCup.items).reduce((sum, item) => {
                return sum + item.quantity;
            }, 0);
        }

        // Update order preview
        function updateOrderPreview() {
            const previewContent = document.getElementById('order-preview-content');

            // Combine all cups (including current) for preview
            const allCups = [...cups];
            if (currentCup.totalScoops > 0) {
                allCups.push({ ...currentCup });
            }

            if (allCups.length === 0) {
                previewContent.innerHTML = `
                    <div class="cup-column">
                        <h4>Vasos</h4>
                        <div class="empty-cup">Sin vasos</div>
                    </div>
                    <div class="flavors-column">
                        <h4>Sabores</h4>
                        <div class="empty-cup">Sin sabores</div>
                    </div>
                    <div class="prices-column">
                        <h4>Precios</h4>
                        <div class="empty-cup">Sin precios</div>
                    </div>
                `;
                return;
            }

            let cupsHtml = '<h4>Vasos</h4>';
            let flavorsHtml = '<h4>Sabores</h4>';
            let pricesHtml = '<h4>Precios</h4>';

            allCups.forEach((cup, index) => {
                cupsHtml += `<div class="cup-item">🍨 Vaso #${cup.cupNumber}</div>`;

                const flavorBreakdown = Object.values(cup.items).map(item =>
                    `${item.flavor} (${item.quantity})`
                ).join('<br>');

                flavorsHtml += `<div class="flavor-item">${flavorBreakdown || 'Vacío'}</div>`;
                pricesHtml += `<div class="price-item">$${cup.subtotal.toFixed(2)}</div>`;
            });

            previewContent.innerHTML = `
                <div class="cup-column">${cupsHtml}</div>
                <div class="flavors-column">${flavorsHtml}</div>
                <div class="prices-column">${pricesHtml}</div>
            `;
        }

        // Submit order with customer name prompt
        async function submitOrder() {
            // Check if there's anything to order
            const allCups = [...cups];
            if (currentCup.totalScoops > 0) {
                allCups.push({ ...currentCup });
            }

            if (allCups.length === 0) {
                alert('Please add at least one scoop to submit the order.');
                return;
            }

            // Prompt for customer name
            const customerName = prompt('Ingrese el nombre del cliente:');
            if (!customerName || customerName.trim() === '') {
                alert('Customer name is required.');
                return;
            }

            // Calculate total
            const total = allCups.reduce((sum, cup) => sum + cup.subtotal, 0);

            // Generate enhanced ticket
            const ticketContainer = document.getElementById('ticket');
            const timestamp = new Date().toLocaleString();

            let ticket = `🥤 PUESTO - PEDIDO AVANZADO 🥤
============================================================
${timestamp}
Cliente: ${customerName}
============================================================`;

            allCups.forEach((cup, index) => {
                ticket += `\n🍨 VASO #${cup.cupNumber} (Total: $${cup.subtotal.toFixed(2)})`;
                ticket += `\n------------------------------------------------------------`;

                Object.values(cup.items).forEach(item => {
                    ticket += `\n${item.flavor} (${item.quantity} scoops) - $${(item.quantity * item.price).toFixed(2)}`;
                });

                if (Object.keys(cup.items).length === 0) {
                    ticket += `\nVacío`;
                }
            });

            ticket += `\n============================================================`;
            ticket += `\nTOTAL GENERAL: $${total.toFixed(2)}`;
            ticket += `\n\n¡Gracias por su pedido!`;
            ticket += `\n============================================================`;

            ticketContainer.textContent = ticket;
            ticketContainer.style.display = 'block';

            try {
                const response = await fetch('/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        cups: allCups,
                        total: total,
                        ticket: ticket,
                        customerName: customerName.trim(),
                        storeId: 'puesto'
                    }),
                });

                if (response.ok) {
                    alert('Order submitted successfully!');
                    // Show the New Order button and hide Submit Order button
                    document.getElementById('new-order-container').style.display = 'block';
                    document.querySelector('.btn-container').style.display = 'none';
                } else {
                    alert('Error submitting order. Please try again.');
                }
            } catch (error) {
                alert('Error submitting order. Please check if the server is running.');
            }
        }

        // Start new order
        function startNewOrder() {
            // Reset everything
            currentCupNumber = 1;
            cups = [];
            currentCup = {
                cupNumber: 1,
                items: {},
                totalScoops: 0,
                subtotal: 0
            };
            selectedFlavor = null;
            actionHistory = [];

            // Reset display
            displayFlavors(availableFlavors);
            updateCurrentCupIndicator();
            updateOrderPreview();
            document.getElementById('ticket').style.display = 'none';
            document.getElementById('new-order-container').style.display = 'none';
            document.querySelector('.btn-container').style.display = 'flex';
        }

        // Initialize the page
        loadFlavors();
    </script>
</body>

</html>
